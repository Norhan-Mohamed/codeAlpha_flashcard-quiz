name: flashcardquizapp
description: A flashcard quiz app with Firestore-backed cards and a simple study quiz.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cloud_firestore: ^6.8.0
  firebase_core: ^4.13.0
  provider: ^6.1.2
  google_fonts: ^8.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
